# ═══════════════════════════════════════════════════════════════
#  好きなもの一覧
#
#  カテゴリ（大きいブロック）の中に items（カード）がぶら下がる形。
#  このファイルの並び順が、そのままページ上の並び順になります。
#
#  ── カテゴリ ──────────────────────────────
#  id    : 色の指定に使う識別子。CSS の --fav-<id> と対応
#  label : セクションの見出し
#  icon  : 見出しの記号
#  tags  : そのカテゴリ全件に自動で付く検索語
#
#  ── items（カード）────────────────────────
#  name     : 必須。カードの見出し
#  sub      : 2行目の小さい文字（アーティスト名・英訳など）
#  url      : 書くとリンクカードになる。省略すると絵文字カード
#  emoji    : リンクなしカードのアイコン
#  badge    : リンクの種類。省略時は URL から自動判定
#             /playlist/ → playlist, open.spotify.com → spotify,
#             tabelog.com → tabelog, それ以外 → official
#  keywords : 検索用の追加語。name / sub / カテゴリの tags は
#             自動で検索対象に入るので、別名だけ書けばよい
#             （例: ネコ に「猫」、僕のヒーローアカデミア に「ヒロアカ」）
#
#  追加     = items に1ブロック足すだけ
#  削除     = ブロックを消すだけ
#  移動     = ブロックを別のカテゴリの items に移すだけ
#  「N items」の件数と id の連番は自動で振り直されます。
# ═══════════════════════════════════════════════════════════════



