          取り組んでいます。人狼ゲーム（AIWolf）をテストベッドとして、個性や意図の
          モデルを統合したエージェントの設計、多エージェント議論の質の改善、
          LLMの行動傾向をプロファイルする評価フレームワークの構築を行っています。
          国際人狼知能コンテストの運営にも携わっています。
