# /research/ の日本語コンテンツ。英語は _data/en/research.yml

hero:
  title: "研究内容"
  tagline: "LLMエージェントによる多人数対話 ― エージェントの構築・改善・評価。"
  sub: >-
    自然言語のみで推論・説得・欺瞞・協調が要求される人狼ゲーム（AIWolf）を
    テストベッドとして研究しています。
  meta:
    - label: "所属"
      value: "静岡大学 情報学部 狩野研究室"
    - label: "研究分野"
      value: "マルチエージェント対話、LLMエージェント、自然言語処理"

sections:
  - title: "LLMエージェントの多人数対話"
    cards:
      - body: >-
          大規模言語モデルは1対1の対話では流暢に振る舞えますが、複数のLLMエージェントによる
          多人数の議論では、他者の発話を無視する、特定の意見に同調する、同じ内容を繰り返す、
          長い対話の中で戦略やペルソナの一貫性を保てない、といったプロセスレベルの問題が
          依然として残っています。私の研究は、この問題に「エージェントの構築」
          「議論プロセスの改善」「モデルと対話品質の評価」の3方向から取り組むものです。

  - title: "アプローチ"
    cards:
      - heading: "構築：階層型BDIと個性を統合したエージェント設計"
        body: |-
          2層のBDI（信念・願望・意図）アーキテクチャと性格理論（MBTI・エニアグラム）を
          統合した人狼エージェントの設計手法です。Macro-BDI層が長期戦略を保持し、
          Micro-BDI層がターンごとの戦術判断を行い、性格から導出した24パラメータが
          発話スタイルだけでなく認識・判断・行動にまで影響します。実験では、勝率を
          わずかに犠牲にする代わりに人間らしさの主観評価が14.1%向上するという、
          「人間らしさと戦略的最適性のトレードオフ」を定量的に示しました。
          第3回 International AIWolfDial Workshop（INLG 2025）で発表。

      - heading: "改善：LLM生成の議論例による議論プロセスの構造化"
        body: |-
          多エージェント議論そのものの質を高める研究に現在取り組んでいます。単一のLLMに
          良質な議論例を生成させ、それをfew-shot例として各エージェントに与える際、
          発話の順序とメタデータ（誰が・どの段階で・どんなイベントの中で話したか）を
          保った提示が「足場」として機能し、他者への応答や議論後半での新しい論点の提示、
          繰り返しの回避を促すことを確認しました。この効果は議論が長いほど、モデルが
          小さいほど大きくなります。この方式で構築したエージェントは、JSAI 2026併設の
          国内大会（AIWolfDial 2026 Spring）の主観評価で9人村・いつでも発話の
          両トラック1位となりました。

      - heading: "評価：6軸傾向プロファイリングによるモデル選択"
        body: |-
          LLMの行動傾向を6軸（論理的推理・戦略的多様性・戦略的品質・ペルソナ可塑性・
          ペルソナ耐性・表現多様性）で測定し、対話パイプラインの入力・思考・出力の
          各段階に対応づける評価フレームワークです。GPT-5.2、Claude Opus 4.5、
          Gemini 3 Proをプロファイルした結果、段階ごとに最適なモデルが異なる
          「分散型プロファイル」が明らかになり、コスト・性能のパレート分析により
          予算制約下での最適なモデル割り当てを導出できます。人工知能学会全国大会
          （JSAI 2026）で発表。

  - title: "人狼知能大会"
    cards:
      - body: |-
          人狼知能コンテスト自然言語部門は、エージェント同士が会話のみで人狼ゲームを
          プレイし、勝率・人間による主観評価・LLM-as-a-judge・ログ解析によって
          評価される競技です。私は参加者と運営の両方の立場で関わっています。
          参加者としてはこれまでに3大会に出場しました。

          - **AIWolfDial 2025 Winter**（国際大会・INLG 2025）— 個性統合エージェントで
            出場し、5人村トラックの主観評価で2位
          - **AIWolfDial 2026 Spring**（国内大会・人工知能学会）— 主観評価で
            9人村・いつでも発話の両トラック1位
          - **AIWolfDial 2026 Winter**（国際大会・INLG 2026）— 1次大会の5人村で
            勝率1位（大会は継続中）

          運営側としてはローカルオーガナイザーを務め、公式サマリ論文の共著者でも
          あります。コンテストのログからは、プレイヤー数が増えると文脈を追えなく
          なるなど、現在のLLMが多人数対話でまだできないことが見え続けており、
          それがそのまま次の研究課題になっています。
