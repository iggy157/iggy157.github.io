# /experience/ の日本語コンテンツ。英語は _data/en/experience.yml

hero:
  title: "活動・経験"
  tagline: "コンテスト運営・学会発表・TA。"
  sub: >-
    国際人狼知能コンテストの運営、学会・ワークショップでの発表、
    TAとしてのNLP・プログラミング教育を行っています。
  meta:
    - label: "役割"
      value: "Local Organizer, AI Wolf Contest / ティーチング・アシスタント"

sections:
  - title: "AI Wolf Contest"
    cards:
      - heading: "ローカルオーガナイザー"
        body: |-
          国際人狼知能コンテスト自然言語部門（INLG 2025 併設の AIWolfDial 2025 など）の
          ローカルオーガナイザーとして、次のような業務を行っています。公式サマリ論文の
          共著者でもあります。

          - コンテスト用サーバの管理・運用
          - 参加チームとのコミュニケーション
          - ワークショップの準備・当日の運営
          - 対戦結果やログの分析（勝率・人間による主観評価・LLM-as-a-judge）
          - 評価や運営に関連するツール・コードの開発
          - NLP2026（言語処理学会年次大会）・JSAI2026（人工知能学会全国大会）併設の
            AIWolfDialワークショップでの人狼ゲームデモの実演

  - title: "発表"
    cards:
      - body: |-
          - **第3回 International AIWolfDial Workshop（INLG 2025）** —
            階層型BDIモデルと個性を統合した人狼エージェントに関する論文発表
          - **JSAI 2026（人工知能学会全国大会）** — LLM傾向性プロファイリング
            （マルチエージェント対話のための6軸評価フレームワーク）の発表
          - **JSAI 2026 併設 AIWolfDial ワークショップ** — 自作コンテスト
            エージェントの設計に関する発表

  - title: "教育"
    cards:
      - heading: "ティーチング・アシスタント（静岡大学）"
        body: |-
          TAとして、大学の下級生にNLP分野やプログラミングを教えています。

          - **先端情報学実習** — 2025年度前期・後期、2026年度前期を担当
          - **データ処理プログラミング** — TAを担当
