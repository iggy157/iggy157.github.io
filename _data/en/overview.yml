hero:
  title: "Yuya Harada"
  tagline: "Multi-party dialogue with LLM agents / Kano Lab, Shizuoka University"
  intro: >-
    This is the portfolio site of Yuya Harada, a student researcher at Kano Laboratory,
    Shizuoka University, working on multi-party dialogue among LLM agents, with the
    Werewolf game (AIWolf) as a testbed, as well as organizing the AI Wolf Contest.
  sub: >-
    Building agents with personality and intention models, improving the
    multi-agent discussion process, and profiling LLM behavior for evaluation.
  meta:
